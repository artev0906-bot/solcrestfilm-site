<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="sfm-title">
  <title id="sfm-title">Diagram of a switchable smart film panel in transparent mode and in private mode</title>
  <defs>
    <filter id="sfm-frost" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <clipPath id="sfm-glass-l"><rect x="59.5" y="107.5" width="349" height="309" /></clipPath>
    <clipPath id="sfm-glass-r"><rect x="591.5" y="107.5" width="349" height="309" /></clipPath>
    <g id="sfm-room">
      <rect x="59.5" y="107.5" width="349" height="309" fill="#efe6d2" />
      <rect x="59.5" y="330" width="349" height="86.5" fill="#e0d3ba" />
      <rect x="59.5" y="326" width="349" height="4" fill="#3a3530" opacity="0.12" />
      <rect x="96" y="150" width="74" height="180" fill="#f7f2e6" />
      <rect x="96" y="150" width="74" height="180" fill="none" stroke="#3a3530" stroke-opacity="0.18" stroke-width="2" />
      <rect x="250" y="176" width="96" height="64" fill="none" stroke="#a97835" stroke-opacity="0.45" stroke-width="3" />
      <rect x="236" y="292" width="140" height="40" rx="3" fill="#d8c09a" />
    </g>
    <g id="sfm-frame">
      <line x1="59.5" y1="227.5" x2="408.5" y2="227.5" stroke="#3a3530" stroke-width="5" />
      <line x1="176" y1="107.5" x2="176" y2="416.5" stroke="#3a3530" stroke-width="5" />
      <line x1="292" y1="107.5" x2="292" y2="416.5" stroke="#3a3530" stroke-width="5" />
      <rect x="59.5" y="107.5" width="349" height="309" fill="none" stroke="#3a3530" stroke-width="7" />
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="559" rx="24" fill="#fffcf6" stroke="#a97835" stroke-opacity="0.18" />

  <!-- Transparent mode -->
  <text x="234" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2.6" fill="#a97835">TRANSPARENT MODE</text>
  <g clip-path="url(#sfm-glass-l)">
    <use href="#sfm-room" />
    <rect x="59.5" y="107.5" width="349" height="309" fill="#dfe9ea" opacity="0.18" />
    <polygon points="59.5,107.5 196,107.5 88,416.5 59.5,416.5" fill="#ffffff" opacity="0.16" />
  </g>
  <use href="#sfm-frame" />
  <rect x="56" y="420" width="356" height="6" rx="3" fill="#1f1b16" opacity="0.07" />
  <text x="234" y="462" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#4f4a43">Clear view through the glass</text>

  <!-- Private mode -->
  <text x="766" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="2.6" fill="#a97835">PRIVATE MODE</text>
  <g clip-path="url(#sfm-glass-r)">
    <g filter="url(#sfm-frost)"><use href="#sfm-room" x="532" /></g>
    <rect x="591.5" y="107.5" width="349" height="309" fill="#ffffff" opacity="0.82" />
    <polygon points="591.5,107.5 728,107.5 620,416.5 591.5,416.5" fill="#ffffff" opacity="0.3" />
  </g>
  <use href="#sfm-frame" x="532" />
  <rect x="588" y="420" width="356" height="6" rx="3" fill="#1f1b16" opacity="0.07" />
  <text x="766" y="462" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#4f4a43">View obscured, daylight still passes</text>

  <!-- Switch between the two states -->
  <path d="M462 262 H430 M430 262 l9 -6 M430 262 l9 6" fill="none" stroke="#a97835" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M538 262 H570 M570 262 l-9 -6 M570 262 l-9 6" fill="none" stroke="#a97835" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="468" y="208" width="64" height="108" rx="11" fill="#fffcf6" stroke="#3a3530" stroke-width="2" />
  <rect x="483" y="224" width="34" height="76" rx="7" fill="#f6f2ea" stroke="#d8c09a" stroke-width="1.5" />
  <line x1="483" y1="262" x2="517" y2="262" stroke="#d8c09a" stroke-width="1.5" />
  <text x="500" y="248" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#a97835">ON</text>
  <text x="500" y="288" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#7b746b">OFF</text>

  <text x="500" y="510" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#7b746b">Which mode is powered depends on the film system — standard PDLC or reverse.</text>
</svg>
